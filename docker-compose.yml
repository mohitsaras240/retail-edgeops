# Phase 1: one simulated store with one PoS service (real container, simulated retail data).
# restart: "no" is deliberate -- recovery must come from the autopilot, not Docker's restart policy.
services:
  pos-store-001:
    build: ./workloads/pos_simulator
    container_name: rea-store001-pos
    environment:
      STORE_ID: store-001
      ENABLE_FAULT_ENDPOINTS: "1"      # demo only: allows /_fault/degrade
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - pos_store001_data:/data
    restart: "no"
volumes:
  pos_store001_data:
